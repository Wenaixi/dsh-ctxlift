name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建
        run: pnpm build

      - name: 单元测试
        run: pnpm test

      - name: 隔离环境全功能验收
        run: pnpm test:e2e

      - name: 发布到 npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # 判据：先看 npm view 的退出码，只有命令成功且返回的版本号精确等于
          # 当前版本才算已发布。原实现直接用 grep 匹配字符串，npm view 报 E404
          # 时错误文本里也含版本号，会被误判成「已发布」而静默跳过。
          PUBLISHED=""
          if PUBLISHED_JSON=$(npm view "dsh-ctxlift@$VERSION" version --json 2>/dev/null); then
            PUBLISHED=$(printf '%s' "$PUBLISHED_JSON" | tr -d '"[:space:]')
          fi
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "dsh-ctxlift@$VERSION 已发布，跳过"
            exit 0
          fi
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::缺少 NPM_TOKEN，无法发布" >&2
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > .npmrc
          npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 解析 release tag
        id: tag
        # github.ref_name 在 tag 触发时是 v<version>，但 workflow_dispatch 手动触发时
        # 是分支名（如 main），直接当 tag_name 会让 action-gh-release 报
        # 「GitHub Releases requires a tag」。统一从 package.json 推导。
        run: |
          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || jq -r .version package.json)
          echo "name=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
